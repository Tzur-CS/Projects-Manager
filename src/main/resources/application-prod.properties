# Production Profile Configuration

# MySQL Database Configuration - Production
# Using same database as dev for now (moveo-db)
#spring.datasource.url=jdbc:mysql://localhost:3306/moveo-db?useSSL=false&serverTimezone=UTC
#spring.datasource.username=root
#spring.datasource.password=12324
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==============================================================================
# AWS COGNITO CONFIGURATION - PRODUCTION
# ==============================================================================

spring.security.oauth2.resourceserver.jwt.audiences=${aws.cognito.clientId}

# ==============================================================================
# SECURITY & LOGGING
# ==============================================================================

# CRITICAL: Disable H2 Console in production (not applicable with MySQL)
spring.h2.console.enabled=false

# Logging Configuration - Reduced verbosity for production
logging.level.root=WARN
logging.level.com.example.demo=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.security.oauth2=INFO
logging.level.org.hibernate=WARN

# Actuator Configuration - Restrict endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# CORS Configuration - Update with your production URLs
# app.cors.allowed-origins=${CORS_ORIGINS:https://yourdomain.com}

