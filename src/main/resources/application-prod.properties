# Production Profile Configuration

# MySQL Database Configuration - Production
# Using same database as dev for now (moveo-db)
spring.datasource.url=jdbc:mysql://localhost:3306/moveo-db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12324
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

