# Server Configuration
server.port=8080

# Application Name
spring.application.name=task-management-system

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/moveo-db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12324
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable H2 Console (not needed with MySQL)
spring.h2.console.enabled=false

# AWS Cognito Configuration
# Replace these with your actual AWS Cognito details
aws.cognito.userPoolId=eu-west-1_zt96SV6xi
aws.cognito.clientId=7qlsrae5tfpa6csvqupibunp6s
aws.cognito.region=eu-west-1
aws.cognito.jwk-set-uri=https://cognito-idp.${aws.cognito.region}.amazonaws.com/${aws.cognito.userPoolId}/.well-known/jwks.json

# Spring Security OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.${aws.cognito.region}.amazonaws.com/${aws.cognito.userPoolId}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${aws.cognito.jwk-set-uri}

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.demo=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=INFO

# Pagination Configuration
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

